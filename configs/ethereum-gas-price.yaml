ingest:
  feature_cols:
    - value
    - gas
    - max_fee_per_gas
    - max_priority_fee_per_gas
    - transaction_type
  fill_zero_cols:
    - max_fee_per_gas
    - max_priority_fee_per_gas
  target_col: gas_price

train:
  target_col: log_gas_price
  model_type: xgboost
  stratify_col: transaction_type
  test_size: 0.2
  hyperparameters:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42

hpo:
  n_trials: 50

serve:
  title: Ethereum Gas Price Predictor
  description: >
    Predicts the effective gas price (in Wei) for an Ethereum transaction
    given only the fields the sender controls before broadcasting.
  model_path: models/model.joblib
  target_description: Predicted effective gas price
  target_unit: Wei
  log_transform: true      # model output is log1p(target); apply expm1 before returning
  fields:
    value:
      type: float
      description: Amount of ETH to transfer, in Wei (1 ETH = 1e18 Wei).
      example: 0.0
      ge: 0
    gas:
      type: int
      description: Gas limit set by the sender. Simple ETH transfer = 21000; contract calls are higher.
      example: 21000
      gt: 0
    max_fee_per_gas:
      type: float
      description: >
        EIP-1559: maximum total fee per gas unit you are willing to pay, in Wei.
        Set to 0 for legacy (type-0) transactions.
      example: 30000000000.0
      ge: 0
    max_priority_fee_per_gas:
      type: float
      description: >
        EIP-1559: miner tip per gas unit, in Wei. Must be <= max_fee_per_gas.
        Set to 0 for legacy transactions.
      example: 2000000000.0
      ge: 0
    transaction_type:
      type: int
      description: "Transaction type: 0 = legacy, 1 = access-list (EIP-2930), 2 = EIP-1559."
      example: 2
      ge: 0
      le: 2
