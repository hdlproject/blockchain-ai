etherscan:
  base_url: https://api.etherscan.io/v2/api
  chain_id: 1
  rate_limit_per_sec: 5
  timeout_sec: 30

collect:
  n_blocks: 2000
  output_path: data/raw/ethereum-blocks.csv

ingest:
  feature_cols:
    - base_fee_gwei
    - gas_used_ratio
    - hour_of_day
    - day_of_week
    - base_fee_trend
  fill_zero_cols: []
  target_col: log_base_fee_gwei

train:
  target_col: log_base_fee_gwei
  model_type: xgboost
  test_size: 0.2
  hyperparameters:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42

serve:
  title: Ethereum Base Fee Predictor
  description: >
    Predicts the next block's base fee (in Gwei) using recent network congestion signals.
    All inputs are derived from block-level data — no per-transaction fields required.
  model_path: models/model.joblib
  target_description: Predicted next-block base fee
  target_unit: Gwei
  log_transform: true
  fields:
    base_fee_gwei:
      type: float
      description: Current block's base fee in Gwei (1 Gwei = 1e9 Wei). Set by the protocol based on the previous block's utilisation.
      example: 15.0
      gt: 0
    gas_used_ratio:
      type: float
      description: Fraction of the block's gas limit that was consumed (0.0–1.0). Values above 0.5 push the base fee up; below 0.5 pushes it down.
      example: 0.5
      ge: 0
      le: 1
    hour_of_day:
      type: int
      description: UTC hour of the block timestamp (0–23). Captures intra-day demand cycles.
      example: 14
      ge: 0
      le: 23
    day_of_week:
      type: int
      description: Day of week of the block timestamp (0 = Monday, 6 = Sunday). Captures weekly demand patterns.
      example: 1
      ge: 0
      le: 6
    base_fee_trend:
      type: float
      description: >
        10-block momentum: (current_base_fee - base_fee_10_blocks_ago) / base_fee_10_blocks_ago.
        Positive means fees are rising; negative means fees are falling.
      example: 0.02
