# Airdrop Farmer Detector
# Add as many known airdrop contracts as you have to build a richer training pool.
# Serving (POST /airdrop-farmer-detector/analyze/{address}) needs no contract address —
# it scores any wallet generically.
task: airdrop_farmer_detector

airdrop:
  # max_wallets: 200  # uncomment to cap wallet count for faster local testing
  contract_addresses:
    - "0x090D4613473dEE047c3f2706764f49E0821D256e" # uniswap
    - "0x035bdAeaB85E47710C27EdA7FD754bA80aD4ad02" # eigenlayer
    - "0xA7Df60785e556d65292A2c9A077bb3A8fBF048BC" # gearbox
    - "0x2c95A9aF4C9129Ef70E2FE1C08c56e7116E50212" # lombard

etherscan:
  base_url: https://api.etherscan.io/v2/api
  chain_id: 1
  rate_limit_per_sec: 5
  timeout_sec: 30

ingest:
  feature_cols:
    - wallet_age_days
    - tx_count_before_first_inflow
    - token_type_diversity
    - inflow_to_outflow_hours
    - shared_funder_score
    - inter_tx_time_variance
    - unique_counterparty_count
  fill_zero_cols:
    - inflow_to_outflow_hours
    - inter_tx_time_variance

train:
  model_type: gmm
  hyperparameters:
    n_components: 4
    covariance_type: full
    random_state: 42

serve:
  model_path: models/airdrop_farmer_detector_gmm.joblib
  db_path: data/jobs.db
