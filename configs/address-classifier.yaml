task: classification

goplus:
  base_url: https://api.gopluslabs.io/api/v1
  chain_id: 1
  rate_limit_per_sec: 2
  timeout_sec: 30

ofac:
  sdn_url: https://www.treasury.gov/ofac/downloads/sdn.csv
  timeout_sec: 60

scamsniffer:
  url: https://raw.githubusercontent.com/scamsniffer/scam-database/main/blacklist/address.json
  timeout_sec: 30

mew:
  url: https://raw.githubusercontent.com/MyEtherWallet/ethereum-lists/master/src/addresses/addresses-darklist.json
  timeout_sec: 30

etherscan:
  base_url: https://api.etherscan.io/v2/api
  chain_id: 1
  rate_limit_per_sec: 5
  timeout_sec: 30

ingest:
  feature_cols:
    - tx_count
    - account_age_days
    - unique_counterparties
    - avg_tx_value_eth
    - failed_tx_ratio
    - contract_creation_count
    - erc20_token_count
    - incoming_to_outgoing_ratio
    - is_contract
    - hour_entropy
    - gas_price_avg_gwei
  fill_zero_cols:
    - failed_tx_ratio
    - contract_creation_count
    - erc20_token_count
  target_col: label

train:
  target_col: label
  model_type: xgboost
  test_size: 0.2
  hyperparameters:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42

paths:
  processed_path: data/processed/features/address_features.csv
  test_path: data/processed/address_features_test.csv
  report_path: reports/address_classifier.json

serve:
  title: Ethereum Address Classifier
  description: Classifies Ethereum addresses.
  model_path: models/address_classifier.joblib
  confidence_threshold: 0.5
  db_path: data/jobs.db
