[project]
name = "blockchain-ai"
version = "0.1.0"
description = ""
authors = [
    {name = "Hendra Danu Laksana",email = "hdl.project.co@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "xgboost (>=2.0.0)",
    "pyyaml (>=6.0)",
    "optuna (>=3.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
